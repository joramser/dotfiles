onboarding = false

[theme]
name = "tokyo-night"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_scope = "all"

[ui.sound]
enabled = false

[ui.toast]
enabled = true

[keys]
prefix = "ctrl+a"
split_vertical = "prefix+|"
workspace_picker = "prefix+s"
settings = "prefix+shift+s"
new_worktree = "prefix+w"
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"

[[keys.command]]
key = "prefix+shift+g"
type = "pane"
command = "gh dash"
